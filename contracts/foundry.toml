[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
# GooseExecutor only fits under the 24 KB code limit through the IR pipeline at a low run count.
additional_compiler_profiles = [{ name = "executor", via_ir = true, optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "src/GooseExecutor.sol", via_ir = true, max_optimizer_runs = 200 }]
# Test vectors exported from the TypeScript reference (npm run contracts:vectors).
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[rpc_endpoints]
base = "${BASE_RPC_URL}"
