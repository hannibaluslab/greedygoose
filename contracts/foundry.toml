[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
# Test vectors exported from the TypeScript reference (npm run contracts:vectors).
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[rpc_endpoints]
base = "${BASE_RPC_URL}"
